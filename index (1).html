<head>
<meta charset="UTF-8">
<!--
  ============================================================
   หน้าครอบระบบแจ้งซ่อม (วางบนโดเมนของหน่วยงาน)
  ============================================================
   - เปิดระบบ Google Apps Script ใน iframe เต็มจอ: ไม่มีขอบ ไม่มีแถบเลื่อน ไม่ redirect
     แถบที่อยู่ (address bar) จะเป็นโดเมนของหน่วยงานตลอด
   - เมื่อแสดงผ่าน iframe แถบ "แอปพลิเคชันนี้สร้างโดยผู้ใช้ Google Apps Script" จะไม่ปรากฏ
     (ต้องใช้ Code.gs เวอร์ชันที่ตั้ง XFrameOptionsMode.ALLOWALL)
   - ส่งต่อพารามิเตอร์ในลิงก์ให้ระบบ เช่น ?me=... (ลิงก์ส่วนตัว) ?job=REQ-... ?page=admin

   ตั้งค่า: แก้บรรทัด APP_URL ด้านล่าง เป็น URL ของ Web App ที่ลงท้ายด้วย /exec
   (Apps Script → Deploy → Manage deployments → คัดลอก Web app URL)
  ============================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4eaef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="แจ้งซ่อม">
<title>ระบบแจ้งซ่อมบำรุงรักษา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233355f6'/%3E%3Ccircle cx='21' cy='22' r='7' fill='%23fff'/%3E%3Cpath d='M41 16 25 48' stroke='%23fff' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  /* สีพื้นตรงกับระบบ ขอบที่เหลือรอบ ๆ (ส่วนรอยบาก/แถบโฮม) จึงกลืนกับแอป */
  :root { --bg: #e4eaef; --bg-2: #edf1f4; --ink: #3a3f47; --muted: #8a919b; --blue-1: #2a8cea; --blue-2: #3a2dff; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    /* กันรอยบาก/แถบโฮมของ iPhone (ค่า safe-area ส่งเข้าไปใน iframe ไม่ได้ จึงเว้นที่หน้าครอบ) */
    box-sizing: border-box;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    font-family: 'Prompt', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: block; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: var(--bg); }

  /* ---------- หน้าโหลด ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg)); color: var(--ink); text-align: center; padding: 24px;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
  #splash img { width: min(260px, 70vw); height: auto; }
  .ring { width: 46px; height: 46px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 20%, var(--blue-1) 55%, var(--blue-2) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash p { margin: 0; font-size: 16px; color: var(--muted); }
  #slow { display: none; flex-direction: column; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  #slow.show { display: flex; }
  #slow button { font: inherit; font-size: 15px; border: 0; border-radius: 999px; padding: 12px 26px; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, var(--blue-1), var(--blue-2)); box-shadow: 0 10px 22px rgba(58, 60, 255, .3); }
  @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2.5s; } #splash { transition: none; } }
</style>
</head>

    <div id="slow">
      <span>การเชื่อมต่อช้ากว่าปกติ</span>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </div>
  </div>

  <iframe id="app" title="ระบบแจ้งซ่อมบำรุงรักษา"
          allow="clipboard-write; camera; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <noscript><p style="padding:24px;text-align:center">กรุณาเปิดใช้ JavaScript เพื่อใช้งานระบบแจ้งซ่อม</p></noscript>

<script>
(function () {
  /* ===== ตั้งค่า: URL ของ Web App (ลงท้ายด้วย /exec) ===== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxYsJNdH0FbTwQJOM8nePuBSyYc4dTS_nzx49O0hq1Knxguq5BvRjXzSI9BMMAxPDbDMA/exec';

  var splash = document.getElementById('splash');
  var frame = document.getElementById('app');
  var hidden = false;

  function hideSplash() {
    if (hidden) return;
    hidden = true;
    splash.classList.add('out');
    setTimeout(function () { splash.style.display = 'none'; }, 500);
  }

  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL) || APP_URL.indexOf('วาง_') >= 0) {
    document.querySelector('.ring').style.display = 'none';
    document.getElementById('splash-msg').textContent = 'ยังไม่ได้ตั้งค่า APP_URL ในไฟล์นี้ (URL ของ Web App ที่ลงท้ายด้วย /exec)';
    return;
  }

  /* ส่งต่อพารามิเตอร์จากลิงก์ของหน่วยงานไปให้ระบบ (?me=, ?job=, ?page=admin) + embed=1 */
  var params = new URLSearchParams(location.search);
  params.set('embed', '1');
  frame.src = APP_URL + '?' + params.toString() + location.hash;

  /* ระบบส่งข้อความ "ready" มาเมื่อวาดหน้าแรกเสร็จ (ตรวจว่ามาจาก iframe ของเราจริง) */
  function fromOurFrame(win) {
    for (var i = 0; win && i < 6; i++) {
      if (win === frame.contentWindow) return true;
      if (win === win.parent) break;
      win = win.parent;
    }
    return false;
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.source === 'repair-app' && d.type === 'ready' && fromOurFrame(e.source)) hideSplash();
  });

  /* สำรอง: ถ้าใช้ระบบเวอร์ชันเก่าที่ยังไม่ส่ง ready → ซ่อนหลัง iframe โหลด 3 วินาที */
  frame.addEventListener('load', function () { setTimeout(hideSplash, 3000); });

  /* โหลดนานผิดปกติ → แสดงปุ่มลองใหม่ */
  setTimeout(function () { if (!hidden) document.getElementById('slow').classList.add('show'); }, 15000);
})();
</script>
</body>
</html>
